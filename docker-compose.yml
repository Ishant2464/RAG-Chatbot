services:

  vector-db:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  valkey:
    image: valkey/valkey
    ports:
      - "6379:6379"

  app:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://vector-db:6333
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - UPLOAD_DIR=/tmp/rag_uploads
    volumes:
      - ./uploads:/tmp/rag_uploads
    depends_on:
      - vector-db
      - valkey

  worker:
    build: .
    command: python -m app.worker
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://vector-db:6333
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - UPLOAD_DIR=/tmp/rag_uploads
    volumes:
      - ./uploads:/tmp/rag_uploads
    depends_on:
      - vector-db
      - valkey

volumes:
  qdrant_data:
